title: Downloads
intro: >-
  Odyssey Desktop connects to your devices, calibrates your screen, and keeps
  your devices' firmware up to date.
notes:
  - title: Which Windows installer do I need?
    text: >-
      Most computers should use the standard installer. The full installer
      includes the camera software, so it installs without an internet
      connection. Choosing an installer does not turn on offline mode; see
      "Offline mode at a glance" below for how to turn it on on each system.
  - title: Firmware updates in offline mode
    text: >-
      In offline mode, Odyssey Desktop doesn't download firmware updates. It
      installs them from a firmware pack, a folder of firmware files that you
      copy into the firmware pack folder for your system, listed below. On
      Windows, installing with OFFLINE_MODE=1 creates that folder. Contact us
      to get a firmware pack.

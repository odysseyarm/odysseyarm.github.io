hero:
  heading:
    accent: Digital Marksmanship
    text: in your OWN HOME.
    newLine: true
  text: >-
    Odyssey Arm delivers next-generation digital marksmanship solutions that
    transform how civilians, law enforcement, and military personnel train.


    Our US Army-funded, next-generation Soldier Virtual Trainer technology
    enables immersive training that accelerates skill development and improves
    shooting accuracy at every level of proficiency.
  primary:
    label: Watch Our Demo
    href: https://youtu.be/zRKGqjDUpmE
  secondary: {}
  image: /src/assets/uploads/hero/image.jpg
  imageAlt: >-
    People training with Odyssey at home, with a police department, and in the
    Army
sections:
  - discriminant: columns
    value:
      heading:
        text: Advanced Training Systems for Civilians, Law Enforcement, and Military
        newLine: false
      columns:
        - title: Civilian Shooters
          text: >-
            Elevate your marksmanship by training on your own HDTV and PC.
            Designed for competition and recreational shooters, and for gamers.
            Shoot with:
          items:
            - text: Real guns retrofitted with CoolFire
              highlight: false
            - text: Green gas, CO₂, or electric-recoil airsoft guns
              highlight: false
            - text: Bluetooth magazines from Mantis and Dry Fire Mag
              highlight: false
          highlight: false
        - title: Law Enforcement
          text: >-
            Equip each member of the department with a personal system that runs
            on an HDTV and a PC, for building and maintaining weapon skills.
            Scenario-based training on projection screens is available from
            partners, to prepare for critical situations. Our technology tracks
            each weapon's pose for comprehensive after-action review.
          items:
            - text: Train on multiple weapon types at once
              highlight: false
            - text: Realistic night training
              highlight: false
          highlight: true
        - title: Military Operations
          text: >-
            Developed for the US Army's Soldier Virtual Trainer (SVT) program, to
            train on multiple weapon types at once, including indirect-fire
            weapons, with realistic ballistics for each. Together with our
            partner Serious Simulations, the system provides complete weapon
            information for all types of small arms.
          items:
            - text: An SDK for defense companies building on OATS
              highlight: false
            - text: Complete weapon data, including pose, for AI training agents
              highlight: false
            - text: Multi-screen configurations
              highlight: false
            - text: Different weapons at the same time
              highlight: false
            - text: Weapon-skills content available from Laser Shot
              highlight: false
          highlight: false
  - discriminant: list
    value:
      heading:
        text: 'Every solution includes high-end features such as:'
        newLine: false
      items:
        - text: Aim trace and pose for each weapon
          highlight: false
        - text: Odyssey's proprietary XR capabilities (ParaLXR)
          highlight: true
  - discriminant: cards
    value:
      heading:
        accent: OATS is the solution.
        text: Odyssey Armament Training System™
        newLine: true
      subheading:
        accent: You can now train in your OWN HOME with your OWN GUNS.
        text: >-
          Play “Call of Duty” on your own console with your own pistol and
          rifle!
        newLine: true
      cards:
        - image: /src/assets/uploads/sections/2/value/cards/0/image.jpg
          imageAlt: Odyssey tracker mounted on a pistol
          title: Smart Hardware
          text: >-
            Precision sensors capture every movement, position, and trigger
            pull.
          highlight: true
        - image: /src/assets/uploads/sections/2/value/cards/1/image.jpg
          imageAlt: Odyssey IR markers, cables, and USB dongle
          title: Software (IR Marker System)
          text: >-
            Constellation Tracking lets you use computer monitors, HDTVs, and
            projection screens.
          highlight: false
        - image: /src/assets/uploads/sections/2/value/cards/2/image.jpg
          imageAlt: >-
            A shooter next to a TV showing his score, with IR markers around the
            screen
          title: Civilian Training at Home
          text: Train at home with cutting-edge military features.
          highlight: true
  - discriminant: numbered
    value:
      heading:
        accent: Next-Generation Training
        text: Capabilities.
        newLine: false
      intro: >-
        The US Army selected the Odyssey Armament Training System (OATS) as the
        foundational platform for the Soldier Virtual Trainer program because of
        its many innovative capabilities. OATS brings the highest-end simulator
        features to the prosumer market and adds unique capabilities of its own.
      columns:
        - title: High-End Features
          items:
            - text: Aim trace for each weapon
              highlight: false
            - text: Multi-screen capability
              highlight: false
            - text: Multiple concurrent weapons
              highlight: false
            - text: Realistic night training and illumination
              highlight: false
            - text: Works with gas-recoil, electric-recoil, and Bluetooth weapons
              highlight: false
        - title: New Exclusive Capabilities
          items:
            - text: Continuous pose tracking for each weapon
              highlight: false
            - text: Indirect fire, aimed above the screen
              highlight: false
            - text: Works with projection screens, HDTVs, and computer monitors
              highlight: false
            - text: >-
                ParaLXR: turns your screen into a VR experience, with no headset
                needed
              highlight: true
            - text: True ballistics, simulated from the weapon's muzzle
              highlight: false
            - text: Realistic tracers
              highlight: false
  - discriminant: specs
    value:
      heading:
        text: Technical Specifications
        newLine: false
      left:
        title: System Architecture
        text: >-
          Odyssey Arm's enterprise-grade middleware runs on a Windows or Linux
          PC and feeds the data from multiple OATS units into the training
          environment.
          The system works with multiple Bluetooth dongles, Wi-Fi, and wired
          weapons.
        rows:
          - label: Aiming Accuracy
            value: ±0.5 MOA at the center of the screen, 1 MOA at the edges
            highlight: false
          - label: Pose Accuracy
            value: 1 cm at 10 ft (3 m)
            highlight: false
          - label: Concurrent Screens
            value: Up to 6, with 2 side by side
            highlight: true
          - label: Display Resolution
            value: Any; the system scales with the display
            highlight: false
          - label: Display Types
            value: Projection screens, HDTVs, and computer monitors
            highlight: true
          - label: Connectivity
            value: Bluetooth LE, Wi-Fi, and USB
            highlight: false
          - label: OATS Trackers
            value: Depends on the computer (16 at once for SVT)
            highlight: false
      right:
        title: Integration Capabilities
        text: >-
          OATS is designed to work with the engines simulators are built on. We
          support VBS4 and Unity, and integrators can ask about other engines.
          The middleware also keeps the trackers' firmware up to date.


          General Dynamics' true-ballistics software already uses our solution,
          and Laser Shot content works with our system.
        listTitle: 'Our technology also works with:'
        items:
          - text: Green gas and CO₂ airsoft guns
            highlight: false
          - text: Electric-recoil airsoft guns
            highlight: false
          - text: CoolFire conversion barrels for real weapons
            highlight: false
          - text: Dvorak
            highlight: false
          - text: Bluetooth magazines from Dry Fire Mag and Mantis
            highlight: false
        calloutTitle: 'Big announcement:'
        calloutText: Laser Ammo software now works with OATS!
  - discriminant: iconCards
    value:
      heading:
        accent: Partnership Opportunities
        text: for Training Organizations, Distributors, and Partners.
        newLine: false
      intro: >-
        Odyssey Arm seeks strategic partners who share our commitment to
        advancing marksmanship training through innovative technology. We offer
        comprehensive support programs designed to ensure partners succeed in
        bringing next-generation training solutions to their markets.
      cards:
        - icon: instructor
          title: Training Organizations
          paragraphs:
            - text: >-
                Instructors at Texas Gun Club and Clear Creek Gun Range use OATS
                to train their classes, and students' feedback on its
                effectiveness has been extremely positive.
              highlight: false
            - text: >-
                New students found that OATS greatly reduced their anxiety about
                shooting for the first time, while experienced students used it
                to find weaknesses in their shooting.
              highlight: true
            - text: >-
                OATS gives instructors a new, interactive way to deliver
                engaging instruction, and can provide additional streams of
                income.
              highlight: false
        - icon: store
          title: Authorized Distributors
          paragraphs:
            - text: >-
                Retailers can run a virtual gun range in their store, livening
                up the customer experience.
              highlight: false
            - text: >-
                OATS opens up new sources of service, product, and recurring
                revenue.
              highlight: false
        - icon: handshake
          title: Development Partners
          paragraphs:
            - text: >-
                OATS greatly expands the total addressable market for simulator
                companies by enabling civilians to train at home on their HDTVs.
              highlight: false
            - text: >-
                Become a development partner to bring your existing content to
                this large, untapped market, or to develop new training and
                gaming content that lets users train with real and airsoft
                weapons.
              highlight: false
  - discriminant: latestPosts
    value:
      title: News
      count: 3
  - discriminant: contact
    value:
      heading:
        accent: Let's stay connected!
        newLine: false
      subheading: We're here for you.
      text: >-
        Our team is ready to help you become a better shooter.


        Whether you're becoming a distributor, improving your marksmanship, or
        exploring partnership opportunities, we'd love to speak with you.
      cards:
        - title: Schedule a Demo
          text: >-
            Experience Odyssey Arm technology firsthand at our demonstration
            facility, or request an on-site presentation.
          href: >-
            mailto:info@odysseyarm.com?subject=Demo%20request&body=Name%3A%0D%0AOrganization%3A%0D%0AI%20am%20%28civilian%20/%20law%20enforcement%20/%20military%20/%20other%29%3A%0D%0ALocation%3A%0D%0ADemo%20at%20your%20facility%20or%20on-site%3A%0D%0AAnything%20else%20we%20should%20know%3A%0D%0A
          highlight: true
        - title: Documentation
          text: >-
            Guides for setting up Odyssey Desktop and your devices, and
            developer docs for building your own games and simulators on
            Odyssey.
          href: /docs/
          highlight: false
      button:
        label: 'Email us: info@odysseyarm.com'
        href: mailto:info@odysseyarm.com

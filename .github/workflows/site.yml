name: Site

# Builds the site on every push and pull request, and deploys it to Cloudflare:
#   - the default branch (and rebuild triggers below) → production
#   - pull requests from this repository → a preview URL posted on the PR
#
# Rebuild triggers besides pushes:
#   - repository_dispatch from odysseyarm/odyssey when its docs/ change or it
#     publishes a release (see docs-site.yml there)
#   - once a day, as a fallback for the same two things
#
# Deploying needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
# Until they are set, the workflow only builds.

on:
  push:
  pull_request:
  repository_dispatch:
    types: [odyssey-docs-updated, odyssey-release]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      # Lets src/lib/releases.ts read GitHub releases without hitting the
      # anonymous rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IS_PRODUCTION: >-
        ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
          || github.event_name == 'repository_dispatch'
          || github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check
        run: npx astro check

      - name: Deploy to production
        if: env.IS_PRODUCTION == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Upload preview
        id: preview
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee upload.log
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v8
        env:
          URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- site-preview -->';
            const body = `${marker}\nPreview: ${process.env.URL}\n\nUpdated for ${context.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
